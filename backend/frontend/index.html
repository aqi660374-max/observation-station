<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>观测站</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #12141C;
    --panel: #1A1D2A;
    --panel-raised: #20243380;
    --ink: #EAE3D2;
    --ink-dim: #7D8299;
    --line: #262A3A;
    --brass: #B8935A;
    --celestial: #6E93B8;
    --alert: #A85D52;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .brand-title {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 23px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.04em;
  }
  .brand-sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .sync-info { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-dim); }
  .refresh-btn {
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 14px; border-radius: 3px; font-size: 12px; cursor: pointer; margin-left: 12px;
  }
  .refresh-btn:hover { border-color: var(--brass); color: var(--brass); }

  .layout { display: flex; align-items: flex-start; }

  /* ---------- 左侧目录树:按主题分组 ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 20px 0;
    position: sticky;
    top: 65px;
    max-height: calc(100vh - 65px);
    overflow-y: auto;
  }
  .sidebar-cluster { margin-bottom: 6px; }
  .sidebar-cluster-label {
    font-size: 11px; color: var(--brass); padding: 0 20px; margin: 18px 0 6px;
    letter-spacing: 0.06em;
  }
  .sidebar-cluster:first-child .sidebar-cluster-label { margin-top: 0; }
  .sidebar-rule {
    height: 1px; background: linear-gradient(90deg, var(--line), transparent);
    margin: 0 20px 8px;
  }
  .tree-node-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 13px;
    border-radius: 3px; margin: 1px 10px;
  }
  .tree-node-row:hover { background: var(--panel); }
  .tree-node-row.selected { background: var(--panel); color: var(--brass); }
  .tree-toggle {
    width: 12px; text-align: center; color: var(--ink-dim); font-size: 10px; user-select: none;
  }
  .tree-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .tree-dot.live { background: var(--celestial); box-shadow: 0 0 5px var(--celestial); }
  .tree-children { display: none; }
  .tree-children.open { display: block; }

  /* ---------- 主区域 ---------- */
  .main {
    flex: 1;
    min-width: 320px;
    padding: 28px 32px 60px;
    border-left: 1px solid var(--line);
  }
  .breadcrumb {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--ink-dim); margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--brass); }
  .breadcrumb .sep { color: var(--line); cursor: default; }

  .node-title {
    font-family: "Noto Serif SC", serif; font-size: 26px; font-weight: 500; margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  .node-summary {
    font-size: 15px; line-height: 1.75; color: var(--ink); margin-bottom: 18px;
    border-left: 2px solid var(--brass); padding-left: 14px;
  }
  .node-detail {
    font-size: 14px; line-height: 1.9; color: var(--ink-dim); margin-bottom: 30px;
    max-width: 740px; white-space: pre-wrap;
  }

  .children-label {
    font-size: 11px; color: var(--brass); margin-bottom: 12px; letter-spacing: 0.05em;
  }
  .children-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1px 16px;
  }
  .child-card {
    border-top: 2px solid var(--line); padding: 14px 2px 14px;
    cursor: pointer; transition: border-color .15s;
  }
  .child-card:hover { border-top-color: var(--brass); }
  .child-card-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .child-card-summary { font-size: 12px; color: var(--ink-dim); line-height: 1.55; }

  /* ---------- 总览:分组展示,标题区带一点星图装饰 ---------- */
  .overview-hero { position: relative; padding-bottom: 4px; margin-bottom: 8px; }
  .overview-hero svg { position: absolute; top: -10px; right: -10px; opacity: 0.35; pointer-events: none; }
  .overview-cluster { margin-bottom: 30px; }
  .overview-cluster-label {
    font-family: "Noto Serif SC", serif; font-size: 15px; color: var(--ink);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .overview-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1px 18px;
  }
  .overview-card {
    border-top: 2px solid var(--brass); padding: 14px 2px 4px;
    cursor: pointer; transition: transform .15s;
  }
  .overview-card:hover { transform: translateY(-2px); }
  .overview-card.is-live { border-top-color: var(--celestial); }
  .overview-card-title {
    font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 500; margin-bottom: 7px;
    display: flex; align-items: center; gap: 7px;
  }
  .overview-card-summary { font-size: 12.5px; color: var(--ink-dim); line-height: 1.65; }

  /* ---------- 实时数据流(Web3板块专用) ---------- */
  .live-item { border-left: 2px solid var(--line); padding-left: 14px; margin-bottom: 12px; }
  .live-time { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--celestial); margin-bottom: 2px; }
  .live-text { font-size: 14px; line-height: 1.6; }
  .live-source { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }

  .empty-hint { font-size: 13px; color: var(--ink-dim); }

  /* ---------- 我是谁:自我画像编辑区 ---------- */
  .profile-section { margin-bottom: 24px; }
  .profile-label { font-size: 14px; font-weight: 500; color: var(--brass); margin-bottom: 7px; }
  .profile-textarea {
    width: 100%; min-height: 70px; max-width: 700px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink); font-size: 14px; line-height: 1.6; padding: 10px 12px;
    font-family: inherit; resize: vertical;
  }
  .profile-textarea:focus { outline: none; border-color: var(--brass); }
  .profile-meta {
    display: flex; align-items: center; gap: 10px; margin-top: 6px;
  }
  .profile-save-btn {
    background: var(--brass); border: none; color: #12141C; font-weight: 500;
    padding: 5px 14px; border-radius: 3px; font-size: 12px; cursor: pointer;
  }
  .profile-save-btn:hover { opacity: 0.88; }
  .profile-save-btn:disabled { opacity: 0.5; cursor: default; }
  .profile-updated { font-size: 11px; color: var(--ink-dim); font-family: "JetBrains Mono", monospace; }

  /* ---------- 总览页的今日焦点横幅 ---------- */
  .focus-banner {
    border-top: 2px solid var(--brass); padding: 14px 2px;
    margin-bottom: 26px; cursor: pointer;
  }
  .focus-banner-label { font-size: 11px; color: var(--brass); margin-bottom: 5px; letter-spacing: 0.05em; }
  .focus-banner-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }

  /* ---------- 立体人形:根据自我画像内容动态生成 ---------- */
  .figure-wrap {
    display: flex; align-items: center; gap: 24px; margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .figure-canvas-box {
    width: 260px; height: 300px; flex-shrink: 0; border-radius: 3px;
    background: radial-gradient(circle at 50% 35%, #1F2436 0%, #12141C 75%);
    border: 1px solid var(--line); overflow: hidden;
  }
  .figure-legend { flex: 1; min-width: 220px; }
  .figure-legend-title { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .figure-legend-item {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    margin-bottom: 6px; color: var(--ink);
  }
  .figure-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .figure-legend-bar {
    flex: 1; height: 3px; background: var(--line); overflow: hidden; max-width: 100px;
  }
  .figure-legend-bar-fill { height: 100%; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <p class="brand-title">观测站</p>
    <p class="brand-sub">个人多领域信号聚合,按数据可信度分区</p>
  </div>
  <div style="display:flex; align-items:center;">
    <span class="sync-info" id="sync-info">最后同步 --:--:--</span>
    <button class="refresh-btn" onclick="refreshAll()">刷新</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
const API_BASE = "";
let TREE = [];
let selectedPath = []; // 存节点id路径,比如 ["ai_startup", "ai_hardware"]

// ---------- 数据加载 ----------
async function loadTree() {
  const res = await fetch(API_BASE + "/api/tree");
  TREE = await res.json();
  renderSidebar();
  renderMain(); // 默认渲染总览
}

async function loadStatusTime() {
  try {
    await fetch(API_BASE + "/api/status");
    document.getElementById("sync-info").textContent =
      "最后同步 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {}
}

function refreshAll() {
  loadTree();
  loadStatusTime();
}

// ---------- 工具函数:按路径在树里查节点 ----------
function findNode(path) {
  let nodes = TREE;
  let node = null;
  for (const id of path) {
    node = (nodes || []).find((n) => n.id === id);
    if (!node) return null;
    nodes = node.children || [];
  }
  return node;
}

function findPathLabels(path) {
  const labels = [];
  let nodes = TREE;
  for (const id of path) {
    const node = (nodes || []).find((n) => n.id === id);
    if (!node) break;
    labels.push({ id, label: node.label });
    nodes = node.children || [];
  }
  return labels;
}

// ---------- 主题分组:一级板块归到5个组里,侧栏和总览页共用同一套分组 ----------
const CLUSTERS = [
  { label: "市场与技术", ids: ["web3", "ai_startup", "ai_frontier", "tech_career"] },
  { label: "内容与信息", ids: ["content_matrix", "china_news"] },
  { label: "内在功课", ids: ["acim", "human_inner_outer"] },
  { label: "方向与方法论", ids: ["world_class_methods", "career_blueprint", "immigration_city"] },
  { label: "命理与待定", ids: ["destiny", "misc"] },
];

// ---------- 左侧目录树渲染 ----------
function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";

  // "总览" 固定在最上面
  const overviewRow = document.createElement("div");
  overviewRow.className = "tree-node-row" + (selectedPath.length === 0 ? " selected" : "");
  overviewRow.innerHTML = `<span class="tree-toggle"></span><span class="tree-dot"></span><span>总览</span>`;
  overviewRow.onclick = () => { selectedPath = []; renderSidebar(); renderMain(); };
  overviewRow.style.margin = "0 10px 16px";
  sidebar.appendChild(overviewRow);

  CLUSTERS.forEach((cluster) => {
    const clusterNodes = cluster.ids.map((id) => TREE.find((n) => n.id === id)).filter(Boolean);
    if (clusterNodes.length === 0) return;
    const clusterWrap = document.createElement("div");
    clusterWrap.className = "sidebar-cluster";

    const label = document.createElement("div");
    label.className = "sidebar-cluster-label";
    label.textContent = cluster.label;
    clusterWrap.appendChild(label);

    const rule = document.createElement("div");
    rule.className = "sidebar-rule";
    clusterWrap.appendChild(rule);

    const list = document.createElement("div");
    buildTreeLevel(clusterNodes, list, [], 0);
    clusterWrap.appendChild(list);

    sidebar.appendChild(clusterWrap);
  });
}

function buildTreeLevel(nodes, container, parentPath, depth) {
  for (const node of nodes) {
    const path = [...parentPath, node.id];
    const isSelected = JSON.stringify(path) === JSON.stringify(selectedPath.slice(0, path.length)) &&
                        selectedPath.length >= path.length && pathsEqual(selectedPath.slice(0, path.length), path);
    const isExactSelected = pathsEqual(selectedPath, path);
    const hasChildren = node.children && node.children.length > 0;
    const isAncestorOfSelected = isPrefixOf(path, selectedPath);

    const row = document.createElement("div");
    row.className = "tree-node-row" + (isExactSelected ? " selected" : "");
    row.style.paddingLeft = (10 + depth * 14) + "px";
    const toggleChar = hasChildren ? (isAncestorOfSelected || isExactSelected ? "▾" : "▸") : "";
    row.innerHTML = `<span class="tree-toggle">${toggleChar}</span><span class="tree-dot${node.type === "live" ? " live" : ""}"></span><span>${node.label}</span>`;
    row.onclick = (e) => {
      e.stopPropagation();
      selectedPath = path;
      renderSidebar();
      renderMain();
    };
    container.appendChild(row);

    if (hasChildren) {
      const childWrap = document.createElement("div");
      childWrap.className = "tree-children" + (isAncestorOfSelected || isExactSelected ? " open" : "");
      buildTreeLevel(node.children, childWrap, path, depth + 1);
      container.appendChild(childWrap);
    }
  }
}

function pathsEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}
function isPrefixOf(prefix, full) {
  if (prefix.length >= full.length) return false;
  return prefix.every((v, i) => v === full[i]);
}

// ---------- 主区域渲染 ----------
function renderMain() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (selectedPath.length === 0) {
    renderOverview(main);
    return;
  }

  const node = findNode(selectedPath);
  if (!node) {
    main.innerHTML = '<div class="empty-hint">没找到这个板块,点左侧目录重新选一个。</div>';
    return;
  }

  // 面包屑
  const crumbLabels = [{ id: null, label: "总览" }, ...findPathLabels(selectedPath)];
  const crumb = document.createElement("div");
  crumb.className = "breadcrumb";
  crumbLabels.forEach((c, i) => {
    const span = document.createElement("span");
    span.textContent = c.label;
    span.onclick = () => {
      selectedPath = crumbLabels.slice(1, i + 1).map((x) => x.id);
      renderSidebar();
      renderMain();
    };
    crumb.appendChild(span);
    if (i < crumbLabels.length - 1) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = " › ";
      crumb.appendChild(sep);
    }
  });
  main.appendChild(crumb);

  const title = document.createElement("h2");
  title.className = "node-title";
  title.textContent = node.label;
  main.appendChild(title);

  if (node.summary) {
    const summary = document.createElement("div");
    summary.className = "node-summary";
    summary.textContent = node.summary;
    main.appendChild(summary);
  }

  if (node.type === "live") {
    renderLiveSection(main);
    return;
  }

  if (node.type === "self_profile") {
    renderSelfProfile(main);
    return;
  }

  if (node.detail) {
    const detail = document.createElement("div");
    detail.className = "node-detail";
    detail.textContent = node.detail;
    main.appendChild(detail);
  }

  if (node.children && node.children.length > 0) {
    const label = document.createElement("div");
    label.className = "children-label";
    label.textContent = "继续往下看 · " + node.children.length + " 项";
    main.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "children-grid";
    node.children.forEach((child) => {
      const card = document.createElement("div");
      card.className = "child-card";
      card.innerHTML = `
        <div class="child-card-title">${child.label}</div>
        <div class="child-card-summary">${child.summary || ""}</div>
      `;
      card.onclick = () => {
        selectedPath = [...selectedPath, child.id];
        renderSidebar();
        renderMain();
      };
      grid.appendChild(card);
    });
    main.appendChild(grid);
  }
}

// ---------- 总览:标题带星图装饰,内容按主题分组,不再是一整块九宫格 ----------
async function renderOverview(main) {
  const hero = document.createElement("div");
  hero.className = "overview-hero";
  hero.innerHTML = `
    <svg width="180" height="120" viewBox="0 0 180 120">
      <circle cx="150" cy="20" r="1.6" fill="var(--brass)" />
      <circle cx="120" cy="45" r="1" fill="var(--celestial)" />
      <circle cx="165" cy="60" r="1.3" fill="var(--brass)" />
      <circle cx="100" cy="15" r="1" fill="var(--ink-dim)" />
      <circle cx="140" cy="85" r="1.2" fill="var(--celestial)" />
      <line x1="150" y1="20" x2="120" y2="45" stroke="var(--line)" stroke-width="1" />
      <line x1="120" y1="45" x2="165" y2="60" stroke="var(--line)" stroke-width="1" />
      <line x1="165" y1="60" x2="140" y2="85" stroke="var(--line)" stroke-width="1" />
      <line x1="100" y1="15" x2="120" y2="45" stroke="var(--line)" stroke-width="1" />
    </svg>
  `;
  const title = document.createElement("h2");
  title.className = "node-title";
  title.textContent = "总览";
  hero.appendChild(title);
  main.appendChild(hero);

  // 今日焦点横幅(读取自我画像里的"我的焦点"字段)
  try {
    const res = await fetch(API_BASE + "/api/profile");
    const sections = await res.json();
    const focusSec = sections.find((s) => s.id === "focus");
    if (focusSec && focusSec.content) {
      const banner = document.createElement("div");
      banner.className = "focus-banner";
      banner.innerHTML = `<div class="focus-banner-label">我的焦点</div><div class="focus-banner-text"></div>`;
      banner.querySelector(".focus-banner-text").textContent = focusSec.content;
      banner.onclick = () => {
        selectedPath = ["human_inner_outer", "self_profile"];
        renderSidebar();
        renderMain();
      };
      main.appendChild(banner);
    }
  } catch (e) {}

  const hint = document.createElement("div");
  hint.className = "node-summary";
  hint.textContent = "每个板块一句话精华,点进去看完整内容;左侧目录也能直接跳到任意层级。";
  main.appendChild(hint);

  CLUSTERS.forEach((cluster) => {
    const clusterNodes = cluster.ids.map((id) => TREE.find((n) => n.id === id)).filter(Boolean);
    if (clusterNodes.length === 0) return;

    const clusterWrap = document.createElement("div");
    clusterWrap.className = "overview-cluster";

    const label = document.createElement("div");
    label.className = "overview-cluster-label";
    label.textContent = cluster.label;
    clusterWrap.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "overview-grid";
    clusterNodes.forEach((node) => {
      const card = document.createElement("div");
      card.className = "overview-card" + (node.type === "live" ? " is-live" : "");
      const dot = node.type === "live"
        ? '<span class="tree-dot live"></span>'
        : '<span class="tree-dot"></span>';
      card.innerHTML = `
        <div class="overview-card-title">${dot}${node.label}</div>
        <div class="overview-card-summary">${node.summary || ""}</div>
      `;
      card.onclick = () => {
        selectedPath = [node.id];
        renderSidebar();
        renderMain();
      };
      grid.appendChild(card);
    });
    clusterWrap.appendChild(grid);
    main.appendChild(clusterWrap);
  });
}

// ---------- 立体人形:身体各部位对应不同板块,内容越充实光效越亮 ----------
let figureAnimId = null;
let figureRenderer = null;
let figureMixer = null;
let figureClock = null;

const MODEL_URL = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/CesiumMan/glTF-Binary/CesiumMan.glb";

const FIGURE_PARTS = [
  { keys: ["focus", "identity"], label: "焦点 / 我是谁", color: 0xC79A3C, part: "head" },
  { keys: ["discipline"], label: "纪律", color: 0x7FA66B, part: "torso" },
  { keys: ["order"], label: "秩序", color: 0x6B9BC7, part: "waist" },
  { keys: ["social_boundary"], label: "社交边界", color: 0xC77F6B, part: "armL" },
  { keys: ["time_boundary"], label: "时间边界", color: 0xB15C48, part: "armR" },
  { keys: ["money_power"], label: "钱权", color: 0xC7B23C, part: "legL" },
  { keys: ["aesthetic_preference"], label: "审美情感", color: 0x9B7FC7, part: "legR" },
  { keys: ["purpose", "integration"], label: "前进的方向", color: 0xE9E6DC, part: "aura" },
];

function fullness(sections, keys) {
  let total = 0;
  keys.forEach((k) => {
    const sec = sections.find((s) => s.id === k);
    if (sec && sec.content) total += sec.content.length;
  });
  return Math.max(0.08, Math.min(1, total / 200));
}

function renderFigureVisual(container, sections) {
  if (figureAnimId) cancelAnimationFrame(figureAnimId);
  if (figureRenderer) {
    figureRenderer.dispose();
    figureRenderer.domElement.remove();
    figureRenderer = null;
  }
  figureMixer = null;
  if (typeof THREE === "undefined") {
    container.innerHTML = '<div class="empty-hint" style="padding:20px;">3D引擎加载失败,刷新页面重试</div>';
    return;
  }

  const width = container.clientWidth || 260;
  const height = container.clientHeight || 300;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
  camera.position.set(0, 0.6, 3.8);
  camera.lookAt(0, -0.15, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.innerHTML = "";
  container.appendChild(renderer.domElement);
  figureRenderer = renderer;

  scene.add(new THREE.AmbientLight(0xfff4e0, 0.7));
  const key1 = new THREE.PointLight(0xffffff, 1.2);
  key1.position.set(2, 3, 3);
  scene.add(key1);
  const key2 = new THREE.PointLight(0xC79A3C, 0.5);
  key2.position.set(-2, -1, 2);
  scene.add(key2);

  const group = new THREE.Group();
  scene.add(group);
  let hairGroupRef = null;

  const fullByPart = {};
  FIGURE_PARTS.forEach((p) => { fullByPart[p.part] = fullness(sections, p.keys); });

  // ---- 环绕的数据光球:每个对应一个自我画像板块,亮度/大小随内容多少变化 ----
  const orbitGroup = new THREE.Group();
  group.add(orbitGroup);
  const orbitSpheres = [];
  FIGURE_PARTS.forEach((p, i) => {
    const f = fullByPart[p.part];
    const mat = new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.35 + f * 0.6 });
    const size = 0.035 + f * 0.06;
    const sph = new THREE.Mesh(new THREE.SphereGeometry(size, 14, 14), mat);
    const angle = (i / FIGURE_PARTS.length) * Math.PI * 2;
    sph.userData = {
      angle,
      radius: 0.85 + (i % 2) * 0.15,
      heightOffset: 0.4 + ((i % 3) * 0.35),
      speed: 0.004 + i * 0.0006,
    };
    orbitGroup.add(sph);
    orbitSpheres.push(sph);
  });

  // ---- 长发:先用最基础的直筒圆柱体+不受光照影响的材质,确保一定看得见 ----
  function addHair(headY) {
    const hairGroup = new THREE.Group();
    const hairMat = new THREE.MeshBasicMaterial({ color: 0xC79A3C });
    const strandCount = 12;
    for (let i = 0; i < strandCount; i++) {
      const spread = (i / (strandCount - 1) - 0.5) * 0.5;
      const len = 0.9 + Math.random() * 0.3;
      const strand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.008, len, 6),
        hairMat
      );
      strand.position.set(spread, headY - len / 2 - 0.05, -0.18 - Math.abs(spread) * 0.1);
      strand.rotation.z = spread * 0.4;
      strand.rotation.x = 0.15;
      hairGroup.add(strand);
    }
    group.add(hairGroup);
    hairGroupRef = hairGroup;
  }

  // ---- 人形模型:加载失败会有兜底提示,不会导致页面空白 ----
  function addFallbackFigure() {
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xEDE6D6, roughness: 0.25, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.1,
      transparent: true, opacity: 0.85,
    });
    const body = new THREE.Group();
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), mat);
    head.position.y = 1.55;
    body.add(head);
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 0.75, 16), mat);
    torso.position.y = 1.0;
    body.add(torso);
    const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.9, 16), mat);
    legs.position.y = 0.35;
    body.add(legs);
    group.add(body);
    addHair(1.55);
    const note = document.createElement("div");
    note.className = "empty-hint";
    note.style.cssText = "position:absolute; bottom:6px; left:8px; font-size:10px;";
    note.textContent = "精细模型加载失败,显示简化版本";
    container.style.position = "relative";
    container.appendChild(note);
  }

  try {
    if (typeof THREE.GLTFLoader === "undefined") {
      addFallbackFigure();
    } else {
      const loader = new THREE.GLTFLoader();
      loader.load(
        MODEL_URL,
        (gltf) => {
          const model = gltf.scene;
          model.traverse((node) => {
            if (node.isMesh) {
              node.material = new THREE.MeshPhysicalMaterial({
                color: 0xEDE6D6, roughness: 0.25, metalness: 0.05,
                clearcoat: 1, clearcoatRoughness: 0.1,
              });
            }
          });
          // 归一化模型大小和位置,不同模型原始比例不一样,这里按包围盒自动缩放居中
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          const scale = 1.7 / maxDim;
          model.scale.setScalar(scale);
          const center = new THREE.Vector3();
          box.getCenter(center);
          model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
          group.add(model);

          if (gltf.animations && gltf.animations.length) {
            figureMixer = new THREE.AnimationMixer(model);
            const action = figureMixer.clipAction(gltf.animations[0]);
            action.play();
          }

          addHair(1.55);
        },
        undefined,
        (err) => {
          console.error("模型加载失败", err);
          addFallbackFigure();
        }
      );
    }
  } catch (e) {
    console.error("加载人形模型时出错", e);
    addFallbackFigure();
  }

  group.position.y = -1.0;

  figureClock = new THREE.Clock();
  function animate() {
    figureAnimId = requestAnimationFrame(animate);
    const delta = figureClock.getDelta();
    if (figureMixer) figureMixer.update(delta);
    group.rotation.y += 0.004;
    if (hairGroupRef) {
      hairGroupRef.rotation.z = Math.sin(figureClock.elapsedTime * 1.3) * 0.05;
      hairGroupRef.rotation.x = Math.cos(figureClock.elapsedTime * 0.9) * 0.02;
    }
    orbitSpheres.forEach((s) => {
      s.userData.angle += s.userData.speed;
      s.position.set(
        Math.cos(s.userData.angle) * s.userData.radius,
        s.userData.heightOffset,
        Math.sin(s.userData.angle) * s.userData.radius
      );
    });
    renderer.render(scene, camera);
  }
  animate();
}

function renderFigureLegend(container, sections) {
  container.innerHTML = '<div class="figure-legend-title">身体各部位对应你填写的板块,内容越充实,光效越亮</div>';
  FIGURE_PARTS.forEach((p) => {
    const f = fullness(sections, p.keys);
    const item = document.createElement("div");
    item.className = "figure-legend-item";
    const hexColor = "#" + p.color.toString(16).padStart(6, "0");
    item.innerHTML = `
      <span class="figure-legend-dot" style="background:${hexColor}"></span>
      <span style="min-width:88px;">${p.label}</span>
      <span class="figure-legend-bar"><span class="figure-legend-bar-fill" style="width:${Math.round(f*100)}%; background:${hexColor};"></span></span>
    `;
    container.appendChild(item);
  });
}

// ---------- "我是谁" 自我画像:可编辑 ----------
async function renderSelfProfile(main) {
  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="empty-hint">加载中…</div>';
  main.appendChild(wrap);

  const res = await fetch(API_BASE + "/api/profile");
  const sections = await res.json();
  wrap.innerHTML = "";

  // 立体人形展示区
  const figureRow = document.createElement("div");
  figureRow.className = "figure-wrap";
  const canvasBox = document.createElement("div");
  canvasBox.className = "figure-canvas-box";
  const legendBox = document.createElement("div");
  legendBox.className = "figure-legend";
  figureRow.appendChild(canvasBox);
  figureRow.appendChild(legendBox);
  wrap.appendChild(figureRow);
  renderFigureVisual(canvasBox, sections);
  renderFigureLegend(legendBox, sections);

  const hint = document.createElement("div");
  hint.className = "node-detail";
  hint.style.marginBottom = "20px";
  hint.textContent = "每一块都是你自己写的,写完点保存;随时可以回来改。这些内容会存在服务器数据库里,重新部署代码不会清空(除非数据库本身被重置)。";
  wrap.appendChild(hint);

  sections.forEach((sec) => {
    const block = document.createElement("div");
    block.className = "profile-section";

    const label = document.createElement("div");
    label.className = "profile-label";
    label.textContent = sec.label;
    block.appendChild(label);

    const textarea = document.createElement("textarea");
    textarea.className = "profile-textarea";
    textarea.value = sec.content || "";
    textarea.placeholder = "写点什么…";
    block.appendChild(textarea);

    const meta = document.createElement("div");
    meta.className = "profile-meta";
    const saveBtn = document.createElement("button");
    saveBtn.className = "profile-save-btn";
    saveBtn.textContent = "保存";
    const updated = document.createElement("span");
    updated.className = "profile-updated";
    updated.textContent = sec.updated_at ? ("上次更新 " + sec.updated_at.slice(0, 16).replace("T", " ")) : "";

    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中…";
      try {
        await fetch(API_BASE + "/api/profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: sec.id, content: textarea.value }),
        });
        saveBtn.textContent = "已保存";
        updated.textContent = "上次更新 " + new Date().toISOString().slice(0, 16).replace("T", " ");
        sec.content = textarea.value;
        renderFigureVisual(canvasBox, sections);
        renderFigureLegend(legendBox, sections);
      } catch (e) {
        saveBtn.textContent = "保存失败,重试";
      }
      setTimeout(() => { saveBtn.disabled = false; if (saveBtn.textContent !== "保存失败,重试") saveBtn.textContent = "保存"; }, 1500);
    };

    meta.appendChild(saveBtn);
    meta.appendChild(updated);
    block.appendChild(meta);

    wrap.appendChild(block);
  });
}


async function renderLiveSection(main) {
  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="empty-hint">加载实时数据中…</div>';
  main.appendChild(wrap);

  const res = await fetch(API_BASE + "/api/feed?topic=crypto&limit=20");
  const items = await res.json();
  wrap.innerHTML = "";

  if (items.length === 0) {
    wrap.innerHTML = '<div class="empty-hint">还没抓到数据,稍等几秒或点右上角刷新。</div>';
    return;
  }

  for (const item of items) {
    const timeRaw = item.published_at || item.fetched_at;
    let timeDisplay = timeRaw;
    try {
      timeDisplay = new Date(timeRaw).toISOString().slice(0, 19).replace("T", " ") + " UTC";
    } catch (e) {}
    const div = document.createElement("div");
    div.className = "live-item";
    div.innerHTML = `
      <div class="live-time">${timeDisplay}</div>
      <div class="live-text">${item.summary || item.title}</div>
      <div class="live-source">来源: ${item.source_name} · 抓取于 ${item.fetched_at.slice(11, 19)} UTC</div>
    `;
    wrap.appendChild(div);
  }
}
